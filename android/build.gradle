buildscript {

  repositories {
    //mintegral sdk依赖   引入mintegral sdk需要添加此maven
    maven {
      url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_support/"
    }
    maven {
      url "https://artifact.bytedance.com/repository/pangle"
    }
    mavenCentral()
  }

  if (project == rootProject) {
    repositories {
      mavenCentral()
      google()
    }
    def buildGradleVersion = ext.has('buildGradlePluginVersion') ? ext.get('buildGradlePluginVersion') : '4.0.1'

    dependencies {
      classpath "com.android.tools.build:gradle:$buildGradleVersion"
    }
  }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  compileSdkVersion safeExtGet('compileSdkVersion', 35)
  buildToolsVersion '35.0.0'

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 34)
    versionCode 1
    versionName "1.0"
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86"
    }
  }
  lintOptions {
    warning 'InvalidPackage'
  }
}

repositories {
  //mintegral sdk依赖   引入mintegral sdk需要添加此maven
  maven {
    url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_support/"
  }
  maven {
    url "https://artifact.bytedance.com/repository/pangle"
  }
  mavenCentral()
  google()
  maven {
    // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
    url "$rootDir/../node_modules/react-native/android"
  }
}

dependencies {
  // compile 'com.qq.e.union:union:+'
  implementation 'com.qq.e.union:union:4.610.1480'
  implementation "com.pangle.cn:ads-sdk-pro:6.9.0.7"
  implementation 'com.facebook.react:react-native:+'
}
